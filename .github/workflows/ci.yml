name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npx -y npm@11.19.0 ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
