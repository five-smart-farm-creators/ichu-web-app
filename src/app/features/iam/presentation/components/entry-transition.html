<div class="entry-backdrop" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <section class="entry-dialog" role="dialog" aria-modal="true" aria-labelledby="entry-title" aria-describedby="entry-status" tabindex="-1" cdkFocusInitial>
    <h2 id="entry-title" class="entry-accessible-title">{{ 'iam.entry.title' | translate }}</h2>
    <div class="entry-logo">
      <img src="/assets/images/ichu-logo.png" alt="ICHU" width="2400" height="2790" decoding="sync">
    </div>
    <div class="entry-message">
      <p id="entry-status" role="status" aria-live="polite">{{ 'iam.entry.status' | translate }}</p>
      <div class="entry-progress" role="progressbar" [attr.aria-label]="'iam.entry.progress' | translate" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="progress()">
        <span [style.transform]="'scaleX(' + progress() / 100 + ')' "></span>
      </div>
    </div>
  </section>
</div>
